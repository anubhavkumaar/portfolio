<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work, freestyle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Manrope:wght@500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
@keyframes akTile{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes akCard{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes akIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ak-t{animation:akTile .9s cubic-bezier(.16,1,.3,1) both}
.ak-tile{transition:opacity .35s,filter .35s,transform .5s cubic-bezier(.16,1,.3,1),box-shadow .35s}
.ak-card{animation:akCard .35s cubic-bezier(.16,1,.3,1) both}
.ak-scroll{scrollbar-width:none}.ak-scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 900px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.glow}};"></div>

  <div class="ak-scroll" onMouseLeave="{{clear}}" style="position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;">
    <div style="position: relative; height: 1120px;">
      <sc-for list="{{tiles}}" as="c" hint-placeholder-count="20">
        <a class="ak-t" href="{{c.href}}" onClick="{{mark}}" aria-label="{{c.title}}" onMouseEnter="{{c.enter}}" style="position: absolute; left: {{c.x}}; top: {{c.y}}; width: {{c.w}}; height: {{c.h}}; display: block; text-decoration: none; animation-delay: {{c.d}};">
          <span class="ak-tile" style="position: absolute; inset: 0; display: block; border-radius: 6px; overflow: hidden; background: {{t.plate}}; opacity: {{c.op}}; filter: {{c.filter}}; transform: {{c.tf}}; box-shadow: {{c.shadow}};">
            <img src="{{c.img}}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            <span style="position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 7px; background: {{t.chip}}; backdrop-filter: blur(8px); font-family: 'Geist Mono', monospace; font-size: 10px; color: {{t.chipFg}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{c.color}};"></span>{{c.n}}</span>
          </span>
        </a>
      </sc-for>

      <sc-if value="{{has}}" hint-placeholder-val="{{false}}">
        <div class="ak-card" aria-hidden="true" style="position: absolute; z-index: 10; left: {{h.cardL}}; top: {{h.cardT}}; width: 420px; display: flex; flex-direction: column; gap: 10px; pointer-events: none;">
          <div style="padding: 26px 28px 24px; border-radius: 26px; background: {{t.card}}; border: 1px solid {{t.cardLine}}; box-shadow: {{t.cardShadow}}; backdrop-filter: blur(22px); display: flex; flex-direction: column; gap: 12px;">
            <span style="display: flex; align-items: center; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: .14em; color: {{t.mute}};"><span>{{h.n}} / 20</span><span>{{h.year}}</span></span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase;">{{h.title}}</span>
            <span style="font-size: 19px; font-weight: 600; line-height: 1.38; letter-spacing: -0.01em;">{{h.lede}}</span>
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: {{t.mute}};">Click the image to open the case study</span>
          </div>
          <div style="padding: 12px 14px; border-radius: 22px; background: {{t.card}}; border: 1px solid {{t.cardLine}}; box-shadow: {{t.cardShadow}}; backdrop-filter: blur(22px); display: flex; flex-wrap: wrap; gap: 6px;">
            <span style="display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.cardLine}}; font-size: 12.5px; font-weight: 700;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{h.color}};"></span>{{h.group}}</span>
            <sc-for list="{{h.stack}}" as="s" hint-placeholder-count="3">
              <span style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.cardLine}}; font-size: 12.5px; font-weight: 600; color: {{t.mute}};">{{s.name}}</span>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; z-index: 15; left: 2.6%; right: 2.6%; top: 124px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; animation: akIn .7s .3s cubic-bezier(.16,1,.3,1) both;">
    <p style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; color: {{t.mute}};">20 PROJECTS, NO ORDER. POINT AT ONE.</p>
    <div style="pointer-events: auto;"><dc-import name="ViewSwitch" dark="{{dark}}" view="freestyle" hint-size="168px,40px"></dc-import></div>
  </div>

  <sc-if value="{{standalone}}" hint-placeholder-val="{{true}}">
  <div style="position: absolute; z-index: 20; left: 0; right: 0; top: 0;">
    <dc-import name="Dock" dark="{{dark}}" active="freestyle" hint-size="100%,112px"></dc-import>
  </div>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"embedded":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hot: -1 };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark ? {
      bg: '#070b16', ink: '#e9eefb', mute: '#8e98b3', plate: '#0d1324',
      glow: 'radial-gradient(ellipse at 30% 20%, rgba(70,120,240,.18), transparent 55%), radial-gradient(ellipse at 80% 80%, rgba(110,90,240,.12), transparent 55%)',
      chip: 'rgba(7,11,22,.6)', chipFg: '#e9eefb',
      card: 'rgba(12,17,30,.88)', cardLine: 'rgba(255,255,255,.12)', cardShadow: '0 30px 80px rgba(0,0,0,.55)', hotRing: '0 0 0 1px rgba(255,255,255,.25), 0 30px 70px rgba(0,0,0,.6)', dim: '.18'
    } : {
      bg: '#f4f6fa', ink: '#0e1116', mute: '#59606b', plate: '#e3e8f3',
      glow: 'radial-gradient(ellipse at 30% 20%, rgba(120,160,240,.22), transparent 55%), radial-gradient(ellipse at 80% 80%, rgba(150,130,240,.12), transparent 55%)',
      chip: 'rgba(255,255,255,.75)', chipFg: '#0e1116',
      card: 'rgba(255,255,255,.9)', cardLine: 'rgba(14,17,22,.09)', cardShadow: '0 30px 80px rgba(40,70,160,.22)', hotRing: '0 0 0 1px rgba(14,17,22,.12), 0 30px 70px rgba(40,70,160,.3)', dim: '.22'
    };
    const GC = { 'Agents': '#2f55e8', 'Retrieval and Search': '#0d8a82', 'Backend and Data': '#6b38d4', 'Frontend': '#1f74d6', 'Quality and Delivery': '#1f9a4a', 'Automation': '#c26a0a', 'Side Builds': '#d6336c' };
    const W = [["agent", "Agent backend, v2", "Agents", "2026", "A supervisor plans each request and hands it to the right specialist.", ["Python", "FastAPI", "LangGraph"], "/redesign/covers/agent.jpg", "CaseStudy.dc.html", 1.3, 100, 17, 200], ["pitstop", "PitStop", "Side Builds", "2025", "An auto shop, run properly, for a GTA roleplay crew.", ["React", "Firebase"], "/redesign/covers/pitstop.jpg", "CasePitStop.dc.html", 19.37, 122, 9, 176], ["mcp", "MCP tool layer", "Agents", "2026", "One protocol, many tools, every agent.", ["Python", "FastMCP", "LangChain"], "/redesign/covers/mcp.jpg", "CaseMcp.dc.html", 29.43, 92, 12, 232], ["retrieval", "Retrieval layer", "Retrieval and Search", "2025", "The search layer behind every answer, built to cite or stay quiet.", ["Python", "FAISS", "AWS Bedrock"], "/redesign/covers/retrieval.jpg", "CaseRetrieval.dc.html", 42.5, 140, 14, 150], ["logs", "Network log agent", "Agents", "2026", "Plain-English questions over network logs, with a guard on every search.", ["Python", "LangGraph", "MCP"], "/redesign/covers/logs.jpg", "CaseLogs.dc.html", 57.57, 106, 11, 210], ["heat", "HEAT", "Side Builds", "2025", "A handbook for a roleplay highway unit.", ["Firebase"], "/redesign/covers/heat.jpg", "CaseHeat.dc.html", 69.63, 130, 13, 170], ["stream", "Chat backend", "Backend and Data", "2026", "Answers that start arriving the moment they exist.", ["Python", "FastAPI", "PostgreSQL"], "/redesign/covers/stream.jpg", "CaseStreaming.dc.html", 83.7, 96, 15, 196], ["multimodal", "Multimodal search", "Retrieval and Search", "2026", "One search across documents, slides and video.", ["Python", "Docling", "AWS Bedrock"], "/redesign/covers/multimodal.jpg", "CaseMultimodal.dc.html", 1.3, 374, 13, 226], ["tickets", "Tickets in chat", "Agents", "2026", "See and raise IT tickets without leaving the conversation.", ["Python", "FastAPI", "MCP"], "/redesign/covers/tickets.jpg", "CaseTickets.dc.html", 15.37, 350, 15, 170], ["sapr", "SAPR", "Side Builds", "2025", "The park rangers department, organised.", ["Firebase"], "/redesign/covers/sapr.jpg", "CaseSapr.dc.html", 31.43, 390, 10, 250], ["portal", "Portal and chat UI", "Frontend", "2026", "The chat people use, with sources they can check.", ["React", "Next.js", "TypeScript"], "/redesign/covers/portal.jpg", "CasePortal.dc.html", 42.5, 360, 16, 186], ["harness", "Test harness", "Quality and Delivery", "2026", "Nothing merges until the chat still works end to end.", ["Playwright", "TypeScript", "GitLab CI"], "/redesign/covers/harness.jpg", "CaseHarness.dc.html", 59.57, 404, 12, 150], ["valo", "Valo Tourney", "Side Builds", "2024", "Brackets and match tracking for community Valorant.", ["Firebase"], "/redesign/covers/valo.jpg", "CaseValo.dc.html", 72.63, 354, 9, 236], ["releases", "Releases", "Quality and Delivery", "2026", "Parallel release lines, shipped on a steady beat.", ["GitLab CI", "Docker"], "/redesign/covers/releases.jpg", "CaseReleases.dc.html", 82.7, 386, 16, 170], ["obs", "Observability", "Backend and Data", "2025", "Every model call traced, timed and costed.", ["OpenTelemetry", "Prometheus", "Langfuse"], "/redesign/covers/obs.jpg", "CaseObservability.dc.html", 1.3, 660, 16, 180], ["jobradar", "Job radar", "Automation", "2026", "My own morning scout for roles worth applying to.", ["Python", "Scheduled agents", "Discord"], "/redesign/covers/jobradar.jpg", "CaseJobRadar.dc.html", 19.58, 684, 11, 236], ["shorts", "Shorts producer", "Automation", "2026", "Long footage in, vertical Shorts out.", ["Python", "ffmpeg"], "/redesign/covers/shorts.jpg", "CaseShorts.dc.html", 32.86, 654, 15, 160], ["rpa", "RPA validation", "Automation", "2024", "Checking the bots before their numbers reach anyone.", ["UiPath", "SQL"], "/redesign/covers/rpa.jpg", "CaseRpa.dc.html", 50.14, 696, 13, 214], ["academy", "AI Academy capstone", "Automation", "2023", "Where the machine learning started.", ["Python", "SQL", "AWS SageMaker"], "/redesign/covers/academy.jpg", "CaseAcademy.dc.html", 65.42, 664, 17, 190], ["site", "This site", "Side Builds", "2026", "A portfolio you can ask questions.", ["React", "Next.js"], "/redesign/covers/site.jpg", "CaseSite.dc.html", 84.7, 680, 14, 170]];
    const hot = this.state.hot;
    const OFF = 120;
    const tiles = W.map(([id, title, group, year, lede, stack, img, href, x, y, w, h], i) => {
      const on = i === hot, any = hot >= 0;
      return {
        title, img, href, color: GC[group], n: String(i + 1).padStart(2, '0'),
        x: x + '%', y: (y + OFF) + 'px', w: w + '%', h: h + 'px',
        d: (0.15 + (i % 7) * 0.06 + Math.floor(i / 7) * 0.12).toFixed(2) + 's',
        op: any && !on ? t.dim : '1', filter: any && !on ? 'grayscale(.6)' : 'none',
        tf: on ? 'scale(1.035)' : 'none', shadow: on ? t.hotRing : 'none',
        enter: () => this.setState({ hot: i })
      };
    });
    let h = {};
    if (hot >= 0) {
      const [id, title, group, year, lede, stack, img, href, x, y, w] = W[hot];
      const right = x + w / 2 < 50;
      h = {
        title, group, year, lede, color: GC[group], n: String(hot + 1).padStart(2, '0'),
        stack: stack.map((name) => ({ name })),
        cardL: right ? `calc(${x + w}% + 18px)` : `calc(${x}% - 438px)`,
        cardT: Math.max(y + OFF - 30, 140) + 'px'
      };
    }
    return { standalone: !this.props.embedded, mark: () => { try { sessionStorage.setItem('akFrom', this.props.dark ? 'FreestyleDark.dc.html' : 'Freestyle.dc.html'); } catch (e) {} }, dark, t, tiles, has: hot >= 0, h, clear: () => this.setState({ hot: -1 }) };
  }
}
</script>
</body>
</html>
