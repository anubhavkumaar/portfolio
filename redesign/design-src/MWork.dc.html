    const group = this.state.group;
    const N = W.length, R = 160;
    const cards = W.map(([id, idx, title, g, year, img], i) => {
      const y0 = i * (2 / N) - 1 + 1 / N;
      const match = group === 'All' || group === g;
      return { title, img: B(img), href: MH(id), op: match ? '1' : '0.12', anim: `akP${i} 2.8s linear ${(0.1 + i * 0.012).toFixed(3)}s both`,
        tf: `rotateY(${((i * 137.508) % 360).toFixed(1)}deg) rotateX(${(Math.asin(y0) * 180 / Math.PI).toFixed(1)}deg) translateZ(${R}px)`,
        z: String(100 - i), fan: `translateY(${(i * -9) + 60}px) translateZ(${-i * 26}px) rotateX(16deg) rotateZ(${(i % 2 ? 1 : -1) * Math.min(i, 6) * 0.6}deg)` };
    });
    const pills = ['All'].concat(ORDER).map((label) => {
      const on = label === group;
      return { label, pressed: on ? 'true' : 'false', bg: on ? t.ink : t.pill, fg: on ? t.bg : t.ink, border: on ? t.ink : t.line, pick: () => this.setState({ group: label }) };
    });
    const n = group === 'All' ? N : W.filter((w) => w[3] === group).length;
    const caption = group === 'All' ? '20 projects in 7 groups' : group + ', ' + n + (n === 1 ? ' project' : ' projects');
    return { mark: () => { try { sessionStorage.setItem('akFromM', this.props.dark ? 'MWorkDark.dc.html' : 'MWork.dc.html'); } catch (e) {} }, logoSrc: (this.props.dark ? '/redesign/brand/logo-on-dark.png' : '/redesign/brand/logo-on-light.png'), dark, t, cards, pills, caption, topLabel: 'WORK' };
  }
}
</script>
</body>
</html>
