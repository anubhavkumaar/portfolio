<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Index: every project, grouped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.92}
@keyframes akKB{0%{transform:scale(1.03)}50%{transform:scale(1.1) translate(-1.5%,-1%)}100%{transform:scale(1.03)}}
@keyframes akBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ak-scroll{scrollbar-width:none}
.ak-scroll::-webkit-scrollbar{display:none}
.ak-tile .ak-view{opacity:0;transform:scale(.6);transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.ak-tile:hover .ak-view{opacity:1;transform:scale(1)}
@keyframes akUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 900px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">


  <div class="ak-scroll" aria-label="All projects" style="position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;">
    <div style="padding: 150px 8px 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
      <h1 style="margin: 0; text-align: center; font-weight: 500; font-size: 18px; letter-spacing: -0.01em;">Everything I have built, <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 21px;">grouped by what it does.</span></h1>

      <div role="group" aria-label="Jump to a group" style="position: sticky; top: 124px; z-index: 4; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px;">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
          <a href="{{g.anchor}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.pill}}; backdrop-filter: blur(12px); text-decoration: none; font-size: 12px; font-weight: 600;">{{g.label}} <span style="color: {{t.mute}}; font-weight: 500;">{{g.n}}</span></a>
        </sc-for>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
        <section id="{{g.id}}" style="display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 140px;">
          <div style="display: flex; align-items: baseline; gap: 10px; padding: 18px 6px 0; border-top: 1px solid {{t.line}};">
            <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .14em; color: {{t.mute}};">{{g.num}}</span>
            <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">{{g.label}}</h2>
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 17px; color: {{t.mute}};">{{g.count}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 8px; row-gap: 36px;">
            <sc-for list="{{g.tiles}}" as="tile" hint-placeholder-count="3">
              <a class="ak-tile" href="{{tile.href}}" onClick="{{mark}}" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: {{t.ink}}; animation: akUp .9s cubic-bezier(.16,1,.3,1) both; animation-delay: {{tile.delay}};">
                <span style="position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: {{t.plate}}; box-shadow: 0 0 0 1px {{t.plateRing}};">
                  <sc-if value="{{tile.vid}}" hint-placeholder-val="{{false}}">
                    <video src="{{tile.vid}}" poster="{{tile.img}}" autoplay muted loop playsinline style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></video>
                  </sc-if>
                  <sc-if value="{{tile.noVid}}" hint-placeholder-val="{{true}}">
                    <img src="{{tile.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: akKB {{tile.dur}} ease-in-out infinite;">
                  </sc-if>
                  <span style="position: absolute; top: 8px; left: 8px; display: inline-flex; gap: 8px; padding: 6px 8px 4px; border-radius: 4px; background: {{t.chip}}; backdrop-filter: blur(10px); color: {{t.chipFg}}; font-size: 12px; font-weight: 600;">{{tile.idx}}<span style="font-weight: 500;">{{tile.kind}}</span></span>
                  <span class="ak-view" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -32px 0 0 -32px; display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: {{t.bubble}}; color: {{t.bubbleFg}}; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 17px;">View</span>
                </span>
                <span style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px;">
                  <span style="font-size: 13px; font-weight: 600;">{{tile.title}}</span>
                  <span style="font-family: 'Instrument Serif', serif; font-size: 15px; color: {{t.mute}};">{{tile.year}}</span>
                </span>
              </a>
            </sc-for>
          </div>
        </section>
      </sc-for>

      <a href="About.dc.html" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 40px; padding: 48px 6px 0; border-top: 1px solid {{t.line}}; text-decoration: none;">
        <span style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; color: {{t.mute}};">KEEP SCROLLING</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 96px; line-height: .9; letter-spacing: -0.045em;">About me <span style="color: {{t.accent}};">→</span></span>
        </span>
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: {{t.mute}}; padding-bottom: 10px;">then Connect</span>
      </a>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 72px; background: {{t.bandTop}}; backdrop-filter: blur(3px) saturate(1.3); border-bottom: 1px solid {{t.bandLine}};"></div>
  <div aria-hidden="true" style="position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; background: {{t.bandBottom}}; backdrop-filter: blur(4px) saturate(1.3); border-top: 1px solid {{t.bandLine}};"></div>

  <div style="position: absolute; z-index: 20; left: 0; right: 0; top: 0;">
    <dc-import name="Dock" dark="{{dark}}" active="index" hint-size="100%,112px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark ? {
      bg: '#070b16', ink: '#e9eefb', mute: '#8e98b3', line: '#1b2238', pill: 'rgba(17,24,44,.72)', accent: '#8ea2ff',
      plate: '#0d1324', plateRing: 'rgba(255,255,255,.06)', node: '#141c33', nodeFg: '#d5dcef', nodeLine: 'rgba(255,255,255,.16)',
      chip: 'rgba(7,11,22,.55)', chipFg: '#e9eefb', bubble: 'rgba(237,237,235,.94)', bubbleFg: '#070b16',
      bandTop: 'linear-gradient(rgba(7,11,22,.85), rgba(7,11,22,.35))', bandBottom: 'linear-gradient(rgba(7,11,22,.35), rgba(7,11,22,.9))', bandLine: 'rgba(255,255,255,.05)'
    } : {
      bg: '#f4f6fa', ink: '#0e1116', mute: '#59606b', line: '#dfe4ec', pill: 'rgba(255,255,255,.75)', accent: '#2f55e8',
      plate: '#ffffff', plateRing: 'rgba(14,17,22,.07)', node: '#f4f6fa', nodeFg: '#1f2430', nodeLine: 'rgba(14,17,22,.18)',
      chip: 'rgba(14,17,22,.55)', chipFg: '#ffffff', bubble: 'rgba(14,17,22,.92)', bubbleFg: '#f4f6fa',
      bandTop: 'linear-gradient(rgba(244,246,250,.9), rgba(244,246,250,.4))', bandBottom: 'linear-gradient(rgba(244,246,250,.4), rgba(244,246,250,.92))', bandLine: 'rgba(14,17,22,.05)'
    };
    const B = (id) => id;
    const W = [
      ['01', 'Agent backend, v2', 'Agents', '2026', '/redesign/media/agent-diagram.jpg', 'video', '/redesign/media/agent-diagram.mp4'],
      ['02', 'MCP tool layer', 'Agents', '2026', '/redesign/covers/mcp.jpg', 'flow'],
      ['03', 'Network log agent', 'Agents', '2026', '/redesign/covers/logs.jpg', 'flow'],
      ['04', 'Tickets in chat', 'Agents', '2026', '/redesign/covers/tickets.jpg', 'flow'],
      ['05', 'Retrieval layer', 'Retrieval and Search', '2025', '/redesign/covers/retrieval.jpg', 'flow'],
      ['06', 'Multimodal search', 'Retrieval and Search', '2026', '/redesign/covers/multimodal.jpg', 'flow'],
      ['07', 'Chat backend', 'Backend and Data', '2026', '/redesign/covers/stream.jpg', 'cinema'],
      ['11', 'Observability', 'Backend and Data', '2025', '/redesign/covers/obs.jpg', 'cinema'],
      ['08', 'Portal and chat UI', 'Frontend', '2026', '/redesign/covers/portal.jpg', 'cinema'],
      ['09', 'Test harness', 'Quality and Delivery', '2026', '/redesign/covers/harness.jpg', 'flow'],
      ['10', 'Releases', 'Quality and Delivery', '2026', '/redesign/covers/releases.jpg', 'cinema'],
      ['14', 'Job radar', 'Automation', '2026', '/redesign/covers/jobradar.jpg', 'cinema'],
      ['15', 'Shorts producer', 'Automation', '2026', '/redesign/covers/shorts.jpg', 'cinema'],
      ['12', 'RPA validation', 'Automation', '2024', '/redesign/covers/rpa.jpg', 'cinema'],
      ['13', 'AI Academy capstone', 'Automation', '2023', '/redesign/covers/academy.jpg', 'cinema'],
      ['17', 'PitStop', 'Side Builds', '2025', '/redesign/covers/pitstop.jpg', 'live site'],
      ['18', 'HEAT', 'Side Builds', '2025', '/redesign/covers/heat.jpg', 'live site'],
      ['19', 'SAPR', 'Side Builds', '2025', '/redesign/covers/sapr.jpg', 'live site'],
      ['20', 'Valo Tourney', 'Side Builds', '2024', '/redesign/covers/valo.jpg', 'live site'],
      ['16', 'This site', 'Side Builds', '2026', '/redesign/covers/site.jpg', 'cinema']
    ];
    const HREF = {"Agent backend, v2": "CaseStudy.dc.html", "MCP tool layer": "CaseMcp.dc.html", "Network log agent": "CaseLogs.dc.html", "Tickets in chat": "CaseTickets.dc.html", "Retrieval layer": "CaseRetrieval.dc.html", "Multimodal search": "CaseMultimodal.dc.html", "Chat backend": "CaseStreaming.dc.html", "Portal and chat UI": "CasePortal.dc.html", "Test harness": "CaseHarness.dc.html", "Releases": "CaseReleases.dc.html", "Observability": "CaseObservability.dc.html", "RPA validation": "CaseRpa.dc.html", "AI Academy capstone": "CaseAcademy.dc.html", "Job radar": "CaseJobRadar.dc.html", "Shorts producer": "CaseShorts.dc.html", "This site": "CaseSite.dc.html", "PitStop": "CasePitStop.dc.html", "HEAT": "CaseHeat.dc.html", "SAPR": "CaseSapr.dc.html", "Valo Tourney": "CaseValo.dc.html"};
    const order = ['Agents', 'Retrieval and Search', 'Backend and Data', 'Frontend', 'Quality and Delivery', 'Automation', 'Side Builds'];
    let k = 0;
    const groups = order.map((label, gi) => {
      const tiles = W.filter((w) => w[2] === label).map(([idx, title, g, year, img, kind, vid]) => ({
        idx, title, year, kind, href: HREF[title] || 'CaseStudy.dc.html', img: B(img), vid: vid ? B(vid) : '', noVid: !vid,
        dur: (13 + (k % 3) * 3) + 's', delay: (Math.min(k++, 8) * 0.07).toFixed(2) + 's'
      }));
      const id = 'g-' + label.toLowerCase().replace(/[^a-z]+/g, '-');
      return { label, id, anchor: '#' + id, num: String(gi + 1).padStart(2, '0'), n: String(tiles.length), count: tiles.length + (tiles.length === 1 ? ' project' : ' projects'), tiles };
    });
    return { mark: () => { try { sessionStorage.setItem('akFrom', this.props.dark ? 'IndexDark.dc.html' : 'Index.dc.html'); } catch (e) {} }, logoSrc: (this.props.dark ? '/redesign/brand/logo-on-dark.png' : '/redesign/brand/logo-on-light.png'), dark, t, groups };
  }
}
</script>
</body>
</html>
