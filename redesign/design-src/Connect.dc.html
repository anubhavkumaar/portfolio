<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect: contact, and /streamconnect for all socials</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
@keyframes akSmokeD{0%,100%{filter:hue-rotate(0deg) saturate(1.3)}50%{filter:hue-rotate(14deg) saturate(1.3)}}
@keyframes akSmokeL{0%,100%{filter:invert(1) hue-rotate(196deg) saturate(1.8) blur(10px)}50%{filter:invert(1) hue-rotate(207deg) saturate(1.7) blur(10px)}}
@keyframes akCloudA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6%,5%) scale(1.12)}}
@keyframes akCloudB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7%,-4%) scale(.92)}}
body{margin:0}
a{color:inherit}
@keyframes akRise{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
@keyframes akUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes akGlow{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14px,10px) scale(1.15)}}
@keyframes akPing{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.ak-l{display:inline-block;animation:akRise 1s cubic-bezier(.16,1,.3,1) both}
.ak-tile{transition:transform .5s cubic-bezier(.16,1,.3,1), border-color .3s}
.ak-tile:hover{transform:translateY(-4px)}
.ak-tile:hover .ak-arrow{transform:translate(3px,-3px)}
.ak-arrow{transition:transform .4s cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@keyframes akToast{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 900px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">
  <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden;">
    <video src="{{t.fieldSrc}}" poster="{{t.fieldPoster}}" autoplay muted loop playsinline style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
    <div style="position: absolute; inset: 0; background: {{t.scrim}};"></div>
  </div>


  <section style="position: absolute; left: 6%; top: 15%; width: 40%; display: flex; flex-direction: column; gap: 22px;">
    <p style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; color: {{t.mute}};">
      <span style="position: relative; display: inline-block; width: 8px; height: 8px;"><span style="position: absolute; inset: 0; border-radius: 50%; background: {{copy.dot}};"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: {{copy.dot}}; animation: akPing 1.8s ease-out infinite;"></span></span>
      {{copy.status}}
    </p>
    <h1 aria-label="{{copy.head}}" style="margin: 0; overflow: hidden; padding-top: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 128px; line-height: .9; letter-spacing: -0.045em;"><sc-for list="{{copy.letters}}" as="ch" hint-placeholder-count="11"><span class="ak-l" style="animation-delay: {{ch.d}};">{{ch.c}}</span></sc-for></h1>
    <p style="margin: 0; max-width: 420px; font-size: 16px; line-height: 1.6; color: {{t.mute}}; animation: akUp .9s .5s cubic-bezier(.16,1,.3,1) both;">{{copy.lede}}</p>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px; animation: akUp .9s .65s cubic-bezier(.16,1,.3,1) both;">
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: {{t.mute}};">write to</span>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="mailto:work@anubhavkumaar.in" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 40px; letter-spacing: -0.03em; text-decoration: none; border-bottom: 2px solid {{t.accent}}; line-height: 1.15;">work@anubhavkumaar.in</a>
        <button type="button" onClick="{{copyEmail}}" aria-label="Copy email address" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.pill}}; color: {{t.ink}}; font: 600 13px Manrope, sans-serif; cursor: pointer; backdrop-filter: blur(12px);">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Copy
        </button>
      </div>
    </div>
  </section>

  <section aria-label="Profiles" style="position: absolute; right: 6%; top: 13%; width: 44%; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 6px 0 0; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .16em; color: {{t.mute}};">{{g.label}}</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{g.items}}" as="s" hint-placeholder-count="4">
            <a class="ak-tile" href="{{s.url}}" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 18px 18px 16px; border-radius: 16px; text-decoration: none; background: {{t.glass}}; border: 1px solid {{s.border}}; box-shadow: {{s.shadow}}; backdrop-filter: blur(18px); animation: akUp .9s cubic-bezier(.16,1,.3,1) both; animation-delay: {{s.delay}};">
              <span aria-hidden="true" style="position: absolute; right: -40px; top: -50px; width: 150px; height: 150px; border-radius: 50%; background: {{s.glow}}; filter: blur(30px); opacity: {{s.glowOp}}; animation: akGlow 7s ease-in-out infinite;"></span>
              <span style="position: relative; display: flex; align-items: center; justify-content: space-between;">
                <span style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .08em; color: {{t.mute}};"><span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; background: {{t.iconBg}}; border: 1px solid {{t.line}}; color: {{t.ink}};"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="{{s.icon}}"></path></svg></span>{{s.kind}}</span>
                <svg class="ak-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
              </span>
              <span style="position: relative; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em;">{{s.name}}</span>
                <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 17px; color: {{t.mute}};">{{s.handle}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </section>

  </sc-if>
  <sc-if value="{{standalone}}" hint-placeholder-val="{{true}}">
  <div style="position: absolute; z-index: 20; left: 0; right: 0; top: 0;">
    <dc-import name="Dock" dark="{{dark}}" active="connect" hint-size="100%,112px"></dc-import>
  </div>
  </sc-if>
  <div role="status" aria-live="polite" style="position: absolute; z-index: 40; left: 50%; bottom: {{toastBottom}}; transform: translateX(-50%); pointer-events: none;">
    <sc-if value="{{copied}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: {{t.ink}}; color: {{t.bg}}; font: 600 13px Manrope, sans-serif; box-shadow: 0 14px 40px rgba(0,0,0,.25); animation: akToast .4s cubic-bezier(.16,1,.3,1) both;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Email copied</span></sc-if>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"embedded":{"editor":"boolean","default":false},"play":{"editor":"boolean","default":true},"stream":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>

      scrim: 'none'
