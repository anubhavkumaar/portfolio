<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro loader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Manrope:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
@keyframes akChrome{0%{opacity:0}8%,72%{opacity:1}82%,100%{opacity:0}}
@keyframes akBar{0%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
@keyframes akName{0%,40%{opacity:0;transform:translateY(80%)}50%,72%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateY(-30%)}}
@keyframes akSub{0%,46%{opacity:0}54%,72%{opacity:1}80%,100%{opacity:0}}
@keyframes akVeil{0%,88%{opacity:0}100%{opacity:1}}
.ak-chrome{animation:akChrome 2.8s ease infinite}
.ak-bar{transform-origin:left;animation:akBar 2.8s cubic-bezier(.65,0,.35,1) infinite}
.ak-l{display:inline-block;animation:akName 2.8s cubic-bezier(.16,1,.3,1) infinite}
.ak-sub{animation:akSub 2.8s ease infinite}
.ak-veil{animation:akVeil 2.8s ease-in infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<main aria-label="Loading anubhavkumaar.in" style="position: relative; width: 100%; height: 900px; overflow: hidden; background: #000; color: #e9eefb; font-family: Manrope, system-ui, sans-serif;">
  <video src="/redesign/media/loader.mp4" poster="/redesign/media/loader.jpg" autoplay muted loop playsinline aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></video>

  <div class="ak-chrome" style="position: absolute; top: 28px; left: 4.5%; right: 4.5%; display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #8e98b3;">
    <img src="{{logoSrc}}" alt="" height="31" style="display: block; height: 31px; width: auto;">
  </div>

  <div style="position: absolute; left: 4.5%; bottom: 64px; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; overflow: hidden; padding-top: 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 76px; line-height: 1; letter-spacing: -0.04em;"><span class="ak-l" style="animation-delay: 0.00s;">A</span><span class="ak-l" style="animation-delay: 0.03s;">n</span><span class="ak-l" style="animation-delay: 0.06s;">u</span><span class="ak-l" style="animation-delay: 0.09s;">b</span><span class="ak-l" style="animation-delay: 0.12s;">h</span><span class="ak-l" style="animation-delay: 0.15s;">a</span><span class="ak-l" style="animation-delay: 0.18s;">v</span><span class="ak-l" style="animation-delay: 0.21s;">&nbsp;</span><span class="ak-l" style="animation-delay: 0.24s;">K</span><span class="ak-l" style="animation-delay: 0.27s;">u</span><span class="ak-l" style="animation-delay: 0.30s;">m</span><span class="ak-l" style="animation-delay: 0.33s;">a</span><span class="ak-l" style="animation-delay: 0.36s;">r</span></h1>
    <p class="ak-sub" style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #b6bfd6;">builds AI agents, retrieval and the screens around them</p>
  </div>

  <div class="ak-chrome" aria-hidden="true" style="position: absolute; left: 4.5%; right: 4.5%; bottom: 32px; height: 1px; background: rgba(255,255,255,.1);"><div class="ak-bar" style="height: 100%; background: #8ea2ff;"></div></div>

  <a href="Main.dc.html" style="position: absolute; z-index: 5; top: 22px; right: 4.5%; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(7,11,22,.5); backdrop-filter: blur(12px); color: #e9eefb; text-decoration: none; font: 600 13px Manrope, sans-serif;">Skip intro <span aria-hidden="true">→</span></a>

  <div class="ak-veil" aria-hidden="true" style="position: absolute; inset: 0; background: #070b16;"></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { logoSrc: '/redesign/brand/logo-on-dark.png', }; }
}
</script>
</body>
</html>
