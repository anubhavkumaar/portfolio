<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Manrope:wght@500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
@keyframes akBar{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes akTick{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
.ak-in{animation:akBar .8s cubic-bezier(.16,1,.3,1) both}
.ak-nv{position:relative;transition:color .25s}
.ak-nv::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1.5px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.ak-nv:hover::after,.ak-nv[aria-current="page"]::after{transform:scaleX(1)}
.ak-talk{transition:gap .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
.ak-talk:hover{gap:12px!important;transform:translateY(-1px)}
.ak-sw{transition:background .3s}
.ak-sw:hover .ak-knob{transform:scale(1.08)}
.ak-knob{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.ak-ln{transition:color .25s}
.ak-ln:hover{color:inherit!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<header style="position: relative; box-sizing: border-box; width: 100%; padding: 20px 2.6% 0; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; inset: 0 0 -40px; background: {{t.veil}}; pointer-events: none;"></div>

  <div style="position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 56px;">
    <div class="ak-in" style="justify-self: start; display: flex; align-items: center; gap: 14px; min-width: 0; max-width: 100%; height: 50px; padding: 0 20px 0 14px; box-sizing: border-box; border-radius: 999px; background: {{t.glass}}; border: 1px solid {{t.edge}}; box-shadow: {{t.shadow}}; backdrop-filter: blur(18px) saturate(1.4); animation-delay: .1s;">
      <a href="Main.dc.html" aria-label="Anubhav Kumar, home" style="flex: 0 0 auto; display: inline-flex; align-items: center; text-decoration: none;">
        <img src="{{logoSrc}}" alt="" height="30" style="display: block; height: 30px; width: auto;">
      </a>
      <span aria-hidden="true" style="flex: 0 0 auto; width: 1px; height: 22px; background: {{t.line}};"></span>
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden;">
        <a class="ak-ln" href="Main.dc.html" style="color: {{t.mute}}; text-decoration: none;">anubhavkumaar.in</a>
        <span style="color: {{t.mute}};">/</span>
        <sc-if value="{{hasParent}}" hint-placeholder-val="{{false}}">
          <a class="ak-ln" href="{{parentHref}}" style="color: {{t.mute}}; text-decoration: none;">{{parent}}</a>
          <span style="color: {{t.mute}};">/</span>
        </sc-if>
        <span style="overflow: hidden; text-overflow: ellipsis;">{{crumbText}}</span>
      </p>
    </div>

    <nav class="ak-in" aria-label="Main" style="display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 5px 0 20px; box-sizing: border-box; border-radius: 999px; background: {{t.glass}}; border: 1px solid {{t.edge}}; box-shadow: {{t.shadow}}; backdrop-filter: blur(18px) saturate(1.4); animation-delay: .2s;">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
        <a class="ak-nv" href="{{l.href}}" onClick="{{jump}}" aria-current="{{l.cur}}" style="display: inline-flex; align-items: center; margin-right: 22px; text-decoration: none; font-size: 14px; font-weight: 700; color: {{l.fg}};">{{l.label}}</a>
      </sc-for>
      <a class="ak-talk" href="{{talkHref}}" onClick="{{jump}}" aria-current="{{talkCur}}" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: {{t.ink}}; color: {{t.bg}}; text-decoration: none; font-size: 13.5px; font-weight: 700;">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{t.live}}; box-shadow: 0 0 8px {{t.live}};"></span>
        Let's talk
        <span aria-hidden="true">→</span>
      </a>
    </nav>

    <button class="ak-sw ak-in" type="button" role="switch" aria-checked="{{darkOn}}" aria-label="Dark theme" style="justify-self: end; position: relative; width: 62px; height: 32px; padding: 0; border-radius: 999px; border: 1px solid {{t.edge}}; background: {{t.track}}; cursor: pointer; animation-delay: .3s;">
      <span aria-hidden="true" style="position: absolute; left: 9px; top: 50%; margin-top: -6px; width: 12px; height: 12px; color: {{t.mute}};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
      <span aria-hidden="true" style="position: absolute; right: 9px; top: 50%; margin-top: -6px; width: 12px; height: 12px; color: {{t.mute}};"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></span>
      <span class="ak-knob" aria-hidden="true" style="position: absolute; top: 3px; left: {{knobL}}; width: 24px; height: 24px; border-radius: 50%; background: {{t.knob}}; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; color: {{t.knobFg}};">
        <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></sc-if>
        <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </span>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"active":{"editor":"enum","options":["home","orbit","freestyle","index","about","connect"],"default":"home"},"crumb":{"editor":"text","default":""},"back":{"editor":"text","default":""},"backLabel":{"editor":"text","default":""},"anchors":{"editor":"boolean","default":false},"route":{"editor":"text","default":""},"$preview":{"width":1440,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const active = this.props.active ?? 'home';
    const t = dark ? {
      ink: '#e9eefb', mute: '#9aa3bb', live: '#4be08a', bg: '#070b16', line: 'rgba(255,255,255,.14)', glass: 'rgba(17,24,44,.62)', edge: 'rgba(255,255,255,.1)', shadow: '0 14px 40px rgba(0,0,0,.45)', track: 'rgba(17,24,44,.8)', knob: '#e9eefb', knobFg: '#070b16', veil: 'linear-gradient(180deg, rgba(7,11,22,.88), rgba(7,11,22,.55) 60%, rgba(7,11,22,0))'
    } : {
      ink: '#0e1116', mute: '#646b76', live: '#4be08a', bg: '#ffffff', line: 'rgba(14,17,22,.14)', glass: 'rgba(255,255,255,.72)', edge: 'rgba(14,17,22,.08)', shadow: '0 14px 40px rgba(40,70,160,.14)', track: 'rgba(255,255,255,.8)', knob: '#0e1116', knobFg: '#ffffff', veil: 'linear-gradient(180deg, rgba(244,246,250,.9), rgba(244,246,250,.55) 60%, rgba(244,246,250,0))'
    };
    const NAME = { home: 'Home', orbit: 'Work', freestyle: 'Work', index: 'Index', about: 'About', connect: 'Connect' };
    const workish = ['orbit', 'freestyle', 'index'].includes(active);
    const crumb = this.props.crumb || '';
    const hasParent = !!crumb || active === 'index' || active === 'freestyle';
    const crumbText = crumb || (active === 'index' ? 'Index' : active === 'freestyle' ? 'Freestyle' : NAME[active]);
    const sfx = dark ? 'Dark' : '';
    const anc = !!this.props.anchors;
    const defs = [['home', 'Home', '01', anc ? '#home' : 'Main' + sfx + '.dc.html'], ['work', 'Work', '02', anc ? '#work' : 'Orbit' + sfx + '.dc.html'], ['about', 'About', '03', anc ? '#about' : 'About' + sfx + '.dc.html']];
    const ORD = { home: 0, orbit: 1, freestyle: 1, index: 1, work: 1, about: 2, connect: 3 };
    const curIdx = ORD[active] ?? 1;
    const links = defs.map(([id, label, n, href]) => {
      const on = id === active || (id === 'work' && workish);
      return { label, n, href, cur: on ? 'page' : 'false', fg: on ? t.ink : t.mute };
    });
    return {
      logoSrc: (dark ? '/redesign/brand/logo-on-dark.png' : '/redesign/brand/logo-on-light.png'),
      t, links, hasParent, parent: this.props.backLabel || 'Work', parentHref: this.props.back || 'Orbit.dc.html', crumbText: this.props.route ? this.props.route : crumbText,
      talkCur: active === 'connect' ? 'page' : 'false', jump: anc ? (e) => {
        if (!e || !e.currentTarget) return;
        const h = e.currentTarget.getAttribute('href') || '';
        if (h.charAt(0) !== '#') return;
        const doc = e.currentTarget.ownerDocument;
        const el = doc && doc.getElementById(h.slice(1));
        if (!el) return;
        e.preventDefault();
        const sc = el.closest ? el.closest('.ak-site') : null; if (sc) sc.scrollTo({ top: el.offsetTop, behavior: 'smooth' }); else el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } : undefined, talkHref: anc ? '#connect' : 'Connect' + sfx + '.dc.html',
      dark, light: !dark, knobL: dark ? '33px' : '3px', darkOn: dark ? 'true' : 'false',
      
    };
  }
}
</script>
</body>
</html>
