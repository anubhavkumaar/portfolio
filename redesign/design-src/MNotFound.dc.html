<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: Not found (404)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Manrope:wght@500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
@keyframes akDrift{0%,100%{transform:translate(0,0)}25%{transform:translate(26px,-14px)}50%{transform:translate(0,-26px)}75%{transform:translate(-26px,-12px)}}
@keyframes akBeam{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
@keyframes akGlow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
@keyframes akFiber{to{stroke-dashoffset:-60}}
@keyframes akFlicker{0%,100%{opacity:.7}42%{opacity:.7}44%{opacity:.15}46%{opacity:.7}71%{opacity:.4}73%{opacity:.75}}
@keyframes akUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ak-up{animation:akUp .9s cubic-bezier(.16,1,.3,1) both}
.ak-fiber{stroke-dasharray:6 10;animation:akFiber 2.4s linear infinite,akFlicker 5s steps(1) infinite}
.ak-btn{transition:transform .35s cubic-bezier(.16,1,.3,1)}
.ak-btn:hover{transform:translateY(-2px)}
.ak-card{transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s}
.ak-card:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 844px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.wash}};"></div>

  <div aria-hidden="true" style="position: absolute; left: 50%; top: 250px; width: 0; height: 0; transform: scale(.72);">
    <svg width="1200" height="520" viewBox="-600 -260 1200 520" style="position: absolute; left: -600px; top: -260px; overflow: visible;">
      <g fill="none" stroke="{{t.fiber}}" stroke-width="1.4" stroke-linecap="round">
        <path class="ak-fiber" d="M-60 20 C-180 60 -260 10 -380 70 S-520 40 -600 90"></path>
        <path class="ak-fiber" d="M60 30 C190 80 250 30 360 110" style="animation-delay: -.8s, -1.7s;"></path>
        <path class="ak-fiber" d="M420 128 C470 150 520 140 600 180" style="animation-delay: -1.2s, -3s;"></path>
        <path class="ak-fiber" d="M-20 70 C-60 160 -140 200 -170 260" style="animation-delay: -.4s, -2.2s;"></path>
        <path class="ak-fiber" d="M30 -60 C110 -150 220 -170 330 -230" style="animation-delay: -1.6s, -.9s;"></path>
      </g>
      <g fill="{{t.accent}}">
        <circle cx="-380" cy="70" r="3"></circle><circle cx="360" cy="110" r="3"></circle><circle cx="-170" cy="260" r="2.5"></circle><circle cx="330" cy="-230" r="2.5"></circle>
      </g>
    </svg>
    <div style="position: absolute; left: 0; top: 0; animation: akDrift 14s ease-in-out infinite;">
      <div style="position: absolute; left: 0; top: 0; width: 0; height: 0; animation: akBeam 7s ease-in-out infinite;">
        <div style="position: absolute; left: -380px; top: 0; width: 760px; height: 560px; background: conic-gradient(from 160deg at 50% 0%, transparent 0deg, {{t.beam}} 14deg, {{t.beamCore}} 20deg, {{t.beam}} 26deg, transparent 40deg); -webkit-mask-image: radial-gradient(ellipse 60% 100% at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 60% 100% at 50% 0%, #000 30%, transparent 85%);"></div>
      </div>
      <div style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, {{t.halo}}, transparent 68%); animation: akGlow 4s ease-in-out infinite;"></div>
      <div style="position: absolute; left: -54px; top: -54px; width: 108px; height: 108px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #ffffff 0%, #c9d6ff 14%, #6f8cff 42%, #2a46c9 70%, #0b1640 100%); box-shadow: 0 0 60px {{t.orbGlow}}, inset -10px -14px 30px rgba(5,10,30,.55), inset 6px 8px 18px rgba(255,255,255,.35);"></div>
      <div style="position: absolute; left: -30px; top: -40px; width: 34px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(4px); transform: rotate(-25deg);"></div>
    </div>
  </div>

  <section aria-labelledby="nf-title" style="position: absolute; left: 20px; right: 20px; top: 380px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <p class="ak-up" style="margin: 0; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px; background: {{t.chip}}; border: 1px solid {{t.line}}; font-family: 'Geist Mono', monospace; font-size: 12px; color: {{t.mute}}; animation-delay: .1s;">GET /this-page <span aria-hidden="true">→</span> <span style="color: {{t.accent}};">404</span></p>
    <h1 id="nf-title" class="ak-up" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.02; letter-spacing: -0.04em; animation-delay: .2s;">This route returned 404.</h1>
    <p class="ak-up" style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px; color: {{t.mute}}; animation-delay: .3s;">The agent looked everywhere. It isn't here.</p>
    <div class="ak-up" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; animation-delay: .4s;">
      <a class="ak-btn" href="{{homeHref}}" style="display: inline-flex; align-items: center; height: 48px; padding: 0 18px; border-radius: 999px; background: {{t.ink}}; color: {{t.bg}}; text-decoration: none; font-size: 14.5px; font-weight: 700;">Back home</a>
      <a class="ak-btn" href="{{workHref}}" style="display: inline-flex; align-items: center; height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.pill}}; text-decoration: none; font-size: 14.5px; font-weight: 700;">See the work</a>
      <a class="ak-btn" href="{{talkHref}}" style="display: inline-flex; align-items: center; height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.pill}}; text-decoration: none; font-size: 14.5px; font-weight: 700;">Let's talk</a>
    </div>
  </section>

  <nav aria-label="Popular projects" class="ak-up" style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; flex-direction: column; gap: 12px; animation-delay: .55s;">
    <p style="margin: 0; text-align: center; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: .16em; color: {{t.mute}};">OR START WITH ONE OF THESE</p>
    <div style="display: grid; grid-template-columns: 1fr; gap: 8px;">
      <sc-for list="{{picks}}" as="k" hint-placeholder-count="3">
        <a class="ak-card" href="{{k.href}}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; border: 1px solid {{t.line}}; background: {{t.glass}}; backdrop-filter: blur(16px); text-decoration: none;">
          <img src="{{k.img}}" alt="" style="width: 76px; height: 50px; border-radius: 9px; object-fit: cover; flex: 0 0 auto;">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 14px; font-weight: 700;">{{k.title}}</span>
            <span style="font-size: 12px; color: {{t.mute}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{k.note}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </nav>

  <div style="position: absolute; z-index: 30; inset: 0; pointer-events: none;"><dc-import name="MDock" dark="{{dark}}" active="home" page="none" label="404" hint-size="100%,100%"></dc-import></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const sfx = dark ? 'Dark' : '';
    const t = dark ? {
      bg: '#070b16', ink: '#e9eefb', mute: '#9aa3bb', line: 'rgba(255,255,255,.1)', accent: '#8ea2ff', pill: 'rgba(17,24,44,.66)', glass: 'rgba(14,20,38,.6)', chip: 'rgba(255,255,255,.05)',
      wash: 'radial-gradient(ellipse 70% 60% at 50% 30%, rgba(47,85,232,.22), transparent 70%)', fiber: 'rgba(142,162,255,.5)',
      beam: 'rgba(142,162,255,.10)', beamCore: 'rgba(170,190,255,.22)', halo: 'rgba(111,140,255,.55)', orbGlow: 'rgba(111,140,255,.7)'
    } : {
      bg: '#f4f6fa', ink: '#0e1116', mute: '#59606b', line: 'rgba(14,17,22,.1)', accent: '#2f55e8', pill: 'rgba(255,255,255,.75)', glass: 'rgba(255,255,255,.72)', chip: 'rgba(255,255,255,.8)',
      wash: 'radial-gradient(ellipse 70% 60% at 50% 30%, rgba(47,85,232,.14), transparent 70%)', fiber: 'rgba(47,85,232,.45)',
      beam: 'rgba(47,85,232,.10)', beamCore: 'rgba(47,85,232,.24)', halo: 'rgba(47,85,232,.35)', orbGlow: 'rgba(47,85,232,.45)'
    };
    const B = (x) => x;
    const picks = [
      { title: 'Agent backend, v2', note: 'A supervisor routes every request', img: B('/redesign/covers/agent.jpg'), href: 'MCaseAgent.dc.html' },
      { title: 'MCP tool layer', note: 'One protocol, many tools', img: B('/redesign/covers/mcp.jpg'), href: 'MCaseMcp.dc.html' },
      { title: 'Retrieval layer', note: 'Cites its sources or stays quiet', img: B('/redesign/covers/retrieval.jpg'), href: 'MCaseRetrieval.dc.html' }
    ];
    return { dark, t, picks, homeHref: 'MHome' + sfx + '.dc.html', workHref: 'MWork' + sfx + '.dc.html', talkHref: 'MConnect' + sfx + '.dc.html' };
  }
}
</script>
</body>
</html>
