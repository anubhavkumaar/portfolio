@keyframes akSpin{from{transform:rotateX(-18deg) rotateY(0deg)}to{transform:rotateX(-18deg) rotateY(720deg)}}
@keyframes akIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes akFace{from{opacity:0;transform:rotateX(-18deg) translateZ(70px) translateY(40px)}to{opacity:1;transform:rotateX(-18deg) translateZ(40px)}}
@keyframes akSheen{0%,60%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
.ak-sp{transform-style:preserve-3d}
@keyframes akTitle{0%{opacity:0;transform:translateY(16px)}15%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}
.ak-title{animation:akTitle 2.5s cubic-bezier(.16,1,.3,1) both;pointer-events:none}
.ak-card{transform-style:preserve-3d}
.ak-lift{transition:transform .55s cubic-bezier(.16,1,.3,1)}
.ak-row{transition:color .25s,padding-left .35s cubic-bezier(.16,1,.3,1)}
.ak-row:hover{padding-left:10px}
.ak-scroll{scrollbar-width:none}.ak-scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</helmet>
<main style="position: relative; width: 100%; height: 900px; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, system-ui, sans-serif;">
  <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.glow}};"></div>

  <header style="position: absolute; z-index: 5; left: 4.5%; top: 136px; width: 38%; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; animation: akIn .7s 2.3s cubic-bezier(.16,1,.3,1) both;">
    <div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.035em;">The work drawer</h1>
      <p style="margin: 8px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: {{t.mute}};">20 projects, filed in 7 groups. Point at one to pull it out.</p>
    </div>
    <dc-import name="ViewSwitch" dark="{{dark}}" view="drawer" hint-size="168px,40px"></dc-import>  </header>

  <nav class="ak-scroll" aria-label="All projects" style="position: absolute; left: 4.5%; top: 244px; bottom: 40px; width: 38%; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
      <section style="display: flex; flex-direction: column; gap: 2px; animation: akIn .7s cubic-bezier(.16,1,.3,1) both; animation-delay: {{g.d}};">
        <h2 style="margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .14em; color: {{t.mute}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{g.color}};"></span>{{g.label}} <span style="opacity: .6;">{{g.n}}</span></h2>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <a class="ak-row" href="{{it.href}}" onClick="{{mark}}" onMouseEnter="{{it.enter}}" style="display: flex; align-items: baseline; gap: 12px; padding: 2px 0; text-decoration: none; color: {{it.fg}};">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1.15;">{{it.title}}</span>
            <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{t.mute}};">{{it.year}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </nav>

  <div class="ak-title" aria-hidden="true" style="position: absolute; z-index: 4; left: 4%; right: 4%; top: 50%; margin-top: -10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600;">
    <span style="color: {{t.mute}};">Anubhav Kumar</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">Work</span>
    <span style="color: {{t.mute}};">20 projects, 7 kinds</span>
  </div>

  <div aria-label="Projects, filed in a drawer" style="position: absolute; left: 44%; right: 0; top: 0; bottom: 0; perspective: 1400px; perspective-origin: 50% -20%;">
    <div class="ak-sp" style="position: absolute; left: 50%; top: 78%; width: 0; height: 0; transform: rotateX(-18deg);">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="20">
        <a class="ak-card" href="{{c.href}}" onClick="{{mark}}" aria-label="{{c.title}}" onMouseEnter="{{c.enter}}" style="position: absolute; left: -200px; top: -250px; width: 400px; height: 250px; display: block; text-decoration: none; transform: {{c.rest}}; animation: {{c.anim}};">
          <span class="ak-lift" style="position: absolute; inset: 0; display: block; transform: {{c.lift}};">
            <span style="position: absolute; top: -27px; left: {{c.tabX}}; width: 33%; height: 28px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 7px; border-radius: 9px 9px 0 0; background: {{c.tabBg}}; color: {{c.tabFg}}; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden;">
              <span style="flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: {{c.color}};"></span>
              <span style="flex: 0 0 auto; font-family: 'Geist Mono', monospace; font-weight: 500; opacity: .6;">{{c.n}}</span>
              <span style="overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>
            </span>
            <span style="position: absolute; inset: 0; display: block; border-radius: 4px 12px 12px 12px; overflow: hidden; background: {{t.bg}}; box-shadow: {{c.ring}};">
              <img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
              <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 35%);"></span>
              <sc-if value="{{c.hot}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); animation: akSheen 2.6s ease-in-out infinite;"></span>
              </sc-if>
            </span>
          </span>
        </a>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 78%; width: 0; height: 0; transform-style: preserve-3d;">
      <a href="{{hot.href}}" onClick="{{mark}}" style="position: absolute; left: -260px; top: -112px; width: 520px; height: 156px; box-sizing: border-box; padding: 22px 26px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 18px; background: {{t.face}}; border: 1px solid {{t.faceLine}}; box-shadow: {{t.faceShadow}}; backdrop-filter: blur(18px); text-decoration: none; transform: rotateX(-18deg) translateZ(40px); animation: akFace .8s 2.9s cubic-bezier(.16,1,.3,1) both;">
        <span style="display: flex; align-items: center; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: .16em; color: {{t.mute}};"><span>FILE {{hot.n}} / 20</span><span style="display: inline-flex; align-items: center; gap: 7px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{hot.color}};"></span>{{hot.groupUp}}</span></span>
        <span style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">{{hot.title}}</span>
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: {{t.mute}};">{{hot.year}}, open the case study</span>
          </span>
          <span aria-hidden="true" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: {{t.ink}}; color: {{t.bg}}; font-size: 18px;">→</span>
        </span>
        <span aria-hidden="true" style="position: absolute; left: 50%; top: 10px; width: 64px; height: 4px; margin-left: -32px; border-radius: 4px; background: {{t.line}};"></span>
      </a>
    </div>
  </div>

  </sc-if>
  <sc-if value="{{standalone}}" hint-placeholder-val="{{true}}">
  <div style="position: absolute; z-index: 20; left: 0; right: 0; top: 0;">
    <dc-import name="Dock" dark="{{dark}}" active="orbit" hint-size="100%,112px"></dc-import>
  </div>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"embedded":{"editor":"boolean","default":false},"play":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hot: 0 };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark ? {
      bg: '#070b16', ink: '#e9eefb', mute: '#8e98b3', line: 'rgba(255,255,255,.12)', accent: '#8ea2ff',
      glow: 'radial-gradient(ellipse at 70% 60%, rgba(70,120,240,.22), transparent 60%)', dim: 'rgba(233,238,251,.38)', tab: '#1a2236', tabOn: '#e9eefb', face: 'rgba(20,27,45,.72)', faceLine: 'rgba(255,255,255,.1)', faceShadow: '0 30px 70px rgba(0,0,0,.5)'
    } : {
      bg: '#f4f6fa', ink: '#0e1116', mute: '#59606b', line: 'rgba(14,17,22,.1)', accent: '#2f55e8',
      glow: 'radial-gradient(ellipse at 70% 60%, rgba(120,160,240,.32), transparent 60%)', dim: 'rgba(14,17,22,.38)', tab: '#ffffff', tabOn: '#0e1116', face: 'rgba(255,255,255,.74)', faceLine: 'rgba(14,17,22,.08)', faceShadow: '0 30px 70px rgba(40,70,160,.2)'
    };
    const I = {
      pitstop: '/redesign/covers/pitstop.jpg',
      heat: '/redesign/covers/heat.jpg',
      sapr: '/redesign/covers/sapr.jpg',
      valo: '/redesign/covers/valo.jpg'
    };
    const work = [
      ['Agent backend, v2', 'Agents', '2026', '/redesign/covers/agent.jpg'],
      ['PitStop', 'Side Builds', '2025', I.pitstop],
      ['MCP tool layer', 'Agents', '2026', '/redesign/covers/mcp.jpg'],
      ['Retrieval layer', 'Retrieval and Search', '2025', '/redesign/covers/retrieval.jpg'],
      ['Network log agent', 'Agents', '2026', '/redesign/covers/logs.jpg'],
      ['HEAT', 'Side Builds', '2025', I.heat],
      ['Chat backend', 'Backend and Data', '2026', '/redesign/covers/stream.jpg'],
      ['Multimodal search', 'Retrieval and Search', '2026', '/redesign/covers/multimodal.jpg'],
      ['Tickets in chat', 'Agents', '2026', '/redesign/covers/tickets.jpg'],
      ['SAPR', 'Side Builds', '2025', I.sapr],
      ['Portal and chat UI', 'Frontend', '2026', '/redesign/covers/portal.jpg'],
      ['Test harness', 'Quality and Delivery', '2026', '/redesign/covers/harness.jpg'],
      ['Valo Tourney', 'Side Builds', '2024', I.valo],
      ['Releases', 'Quality and Delivery', '2026', '/redesign/covers/releases.jpg'],
      ['Observability', 'Backend and Data', '2025', '/redesign/covers/obs.jpg'],
      ['Job radar', 'Automation', '2026', '/redesign/covers/jobradar.jpg'],
      ['Shorts producer', 'Automation', '2026', '/redesign/covers/shorts.jpg'],
      ['RPA validation', 'Automation', '2024', '/redesign/covers/rpa.jpg'],
      ['AI Academy capstone', 'Automation', '2023', '/redesign/covers/academy.jpg'],
      ['This site', 'Side Builds', '2026', '/redesign/covers/site.jpg']
    ];
    const HREF = {"Agent backend, v2": "CaseStudy.dc.html", "MCP tool layer": "CaseMcp.dc.html", "Network log agent": "CaseLogs.dc.html", "Tickets in chat": "CaseTickets.dc.html", "Retrieval layer": "CaseRetrieval.dc.html", "Multimodal search": "CaseMultimodal.dc.html", "Chat backend": "CaseStreaming.dc.html", "Portal and chat UI": "CasePortal.dc.html", "Test harness": "CaseHarness.dc.html", "Releases": "CaseReleases.dc.html", "Observability": "CaseObservability.dc.html", "RPA validation": "CaseRpa.dc.html", "AI Academy capstone": "CaseAcademy.dc.html", "Job radar": "CaseJobRadar.dc.html", "Shorts producer": "CaseShorts.dc.html", "This site": "CaseSite.dc.html", "PitStop": "CasePitStop.dc.html", "HEAT": "CaseHeat.dc.html", "SAPR": "CaseSapr.dc.html", "Valo Tourney": "CaseValo.dc.html"};
    const ORDER = ['Agents', 'Retrieval and Search', 'Backend and Data', 'Frontend', 'Quality and Delivery', 'Automation', 'Side Builds'];
    const GC = { 'Agents': '#2f55e8', 'Retrieval and Search': '#0d8a82', 'Backend and Data': '#6b38d4', 'Frontend': '#1f74d6', 'Quality and Delivery': '#1f9a4a', 'Automation': '#c26a0a', 'Side Builds': '#d6336c' };
    const list = ORDER.flatMap((g) => work.filter((w) => w[1] === g));
    const hot = Math.min(this.state.hot || 0, list.length - 1);
    const N = list.length;
    const cards = list.map(([title, g, year, img], i) => {
      const on = i === hot;
      return {
        title, img, href: HREF[title] || 'CaseStudy.dc.html', hot: on, n: String(i + 1).padStart(2, '0'), color: GC[g],
        rest: `translateZ(${(i - (N - 1)) * 22}px) rotateX(-4deg)`,
        lift: on ? 'translateY(-96px)' : 'none',
        anim: `akF${i} 2.9s linear ${(0.1 + i * 0.012).toFixed(3)}s backwards`,
        tabX: ['0%', '33.5%', '67%'][i % 3],
        tabBg: on ? t.tabOn : t.tab, tabFg: on ? t.bg : t.ink,
        ring: on ? `0 0 0 2px ${t.accent}, 0 -14px 40px rgba(20,40,90,.28)` : `0 0 0 1px ${t.line}, 0 -10px 30px rgba(20,40,90,.16)`,
        enter: () => this.setState({ hot: i })
      };
    });
    let idx = 0;
    const groups = ORDER.map((label, gi) => {
      const items = work.filter((w) => w[1] === label).map(([title, g, year]) => {
        const i = idx++;
        return { title, year, href: HREF[title] || 'CaseStudy.dc.html', fg: i === hot ? t.ink : t.dim, enter: () => this.setState({ hot: i }) };
      });
      return { label: label.toUpperCase(), n: String(items.length), color: GC[label], d: (2.35 + gi * 0.06).toFixed(2) + 's', items };
    });
    const h = list[hot];
    return { standalone: !this.props.embedded, playing: this.props.play !== false, mark: () => { try { sessionStorage.setItem('akFrom', this.props.dark ? 'OrbitDark.dc.html' : 'Orbit.dc.html'); } catch (e) {} }, logoSrc: (this.props.dark ? '/redesign/brand/logo-on-dark.png' : '/redesign/brand/logo-on-light.png'), dark, t, cards, groups, hot: { title: h[0], group: h[1], groupUp: h[1].toUpperCase(), year: h[2], n: String(hot + 1).padStart(2, '0'), color: GC[h[1]], href: HREF[h[0]] || 'CaseStudy.dc.html' } };
  }
}
</script>
