<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card (1200x630)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="/redesign/brand/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Manrope:wght@500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1200px; height: 630px; overflow: hidden; background: #070b16; color: #eef2fb; font-family: Manrope, system-ui, sans-serif;">
  <img src="{{bg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{bgPos}};">
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,11,22,.94) 0%, rgba(7,11,22,.82) 42%, rgba(7,11,22,.25) 75%, rgba(7,11,22,.1) 100%);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 50% 70% at 0% 100%, {{glow}}, transparent 70%);"></div>
  <div style="position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px;">
    <img src="/redesign/brand/logo-on-dark.png" alt="" style="height: 40px; width: auto;">
    <span style="width: 1px; height: 26px; background: rgba(255,255,255,.25);"></span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: .14em; color: #aab3cc;">{{kicker}}</span>
  </div>
  <div style="position: absolute; left: 72px; right: 470px; top: 200px; display: flex; flex-direction: column; gap: 18px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: {{titleSize}}; line-height: .98; letter-spacing: -0.045em;">{{title}}</h1>
    <p style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; line-height: 1.25; color: #d5dcef;">{{lede}}</p>
  </div>
  <div style="position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-family: 'Geist Mono', monospace; font-size: 18px; color: #eef2fb;">anubhavkumaar.in</span>
    <span style="display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); font-size: 16px; font-weight: 700;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{dot}}; box-shadow: 0 0 10px {{dot}};"></span>{{badge}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"p":{"editor":"enum","options":["home", "agent", "mcp", "logs", "tickets", "retrieval", "multimodal", "stream", "portal", "harness", "releases", "obs", "rpa", "academy", "jobradar", "shorts", "site", "pitstop", "heat", "sapr", "valo"],"default":"home"},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    const id = this.props.p || 'home';
    const D = {
      agent: ['Agent backend, v2', 'Agents', '2026', '/redesign/covers/agent.jpg', "A supervisor plans each request and hands it to the right specialist."],
      mcp: ['MCP tool layer', 'Agents', '2026', '/redesign/covers/mcp.jpg', "One protocol, many tools, every agent."],
      logs: ['Network log agent', 'Agents', '2026', '/redesign/covers/logs.jpg', "Plain-English questions over network logs, with a guard on every search."],
      tickets: ['Tickets in chat', 'Agents', '2026', '/redesign/covers/tickets.jpg', "See and raise IT tickets without leaving the conversation."],
      retrieval: ['Retrieval layer', 'Retrieval and Search', '2025', '/redesign/covers/retrieval.jpg', "The search layer behind every answer, built to cite or stay quiet."],
      multimodal: ['Multimodal search', 'Retrieval and Search', '2026', '/redesign/covers/multimodal.jpg', "One search across documents, slides and video."],
      stream: ['Chat backend', 'Backend and Data', '2026', '/redesign/covers/stream.jpg', "Answers that start arriving the moment they exist."],
      portal: ['Portal and chat UI', 'Frontend', '2026', '/redesign/covers/portal.jpg', "The chat people use, with sources they can check."],
      harness: ['Test harness', 'Quality and Delivery', '2026', '/redesign/covers/harness.jpg', "Nothing merges until the chat still works end to end."],
      releases: ['Releases', 'Quality and Delivery', '2026', '/redesign/covers/releases.jpg', "Parallel release lines, shipped on a steady beat."],
      obs: ['Observability', 'Backend and Data', '2025', '/redesign/covers/obs.jpg', "Every model call traced, timed and costed."],
      rpa: ['RPA validation', 'Automation', '2024', '/redesign/covers/rpa.jpg', "Checking the bots before their numbers reach anyone."],
      academy: ['AI Academy capstone', 'Automation', '2023', '/redesign/covers/academy.jpg', "Where the machine learning started."],
      jobradar: ['Job radar', 'Automation', '2026', '/redesign/covers/jobradar.jpg', "My own morning scout for roles worth applying to."],
      shorts: ['Shorts producer', 'Automation', '2026', '/redesign/covers/shorts.jpg', "Long footage in, vertical Shorts out."],
      site: ['This site', 'Side Builds', '2026', '/redesign/covers/site.jpg', "A portfolio you can ask questions."],
      pitstop: ['PitStop', 'Side Builds', '2025', '/redesign/covers/pitstop.jpg', "An auto shop, run properly, for a GTA roleplay crew."],
      heat: ['HEAT', 'Side Builds', '2025', '/redesign/covers/heat.jpg', "A handbook for a roleplay highway unit."],
      sapr: ['SAPR', 'Side Builds', '2025', '/redesign/covers/sapr.jpg', "The park rangers department, organised."],
      valo: ['Valo Tourney', 'Side Builds', '2024', '/redesign/covers/valo.jpg', "Brackets and match tracking for community Valorant."]
    };
    const ACC = { 'Agents': '#8ea2ff', 'Retrieval and Search': '#5fe3d6', 'Backend and Data': '#b79bff', 'Frontend': '#86c3ff', 'Quality and Delivery': '#7fe3a0', 'Automation': '#ffc56b', 'Side Builds': '#ff8fb1' };
    if (id === 'home' || !D[id]) {
      return { bg: '/redesign/media/smoke-dark-phone.jpg', bgPos: 'center', glow: 'rgba(47,85,232,.35)', kicker: 'PORTFOLIO', title: 'Anubhav Kumar', titleSize: '92px',
        lede: 'GenAI engineer: agents, MCP tools and RAG in production.', badge: 'Open to GenAI roles', dot: '#3ccf7a' };
    }
    const [title, group, year, cover, lede] = D[id];
    const a = ACC[group] || '#8ea2ff';
    return { bg: cover, bgPos: 'right center', glow: a + '44', kicker: group.toUpperCase() + ', ' + year, title, titleSize: title.length > 18 ? '64px' : '80px', lede, badge: 'Case study', dot: a };
  }
}
</script>
</body>
</html>
